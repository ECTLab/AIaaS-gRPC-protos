syntax = "proto3";

package wallet_server;

import "google/protobuf/timestamp.proto";


service Wallet {
    rpc CreateNewWallet(CreateNewWalletRequest) returns (CreateNewWalletResponse);
    rpc HasUserWallet(HasUserWalletRequest) returns (HasUserWalletResponse);
    rpc OnlinePayment(OnlinePaymentRequest) returns (OnlinePaymentResponse);
    rpc VerifyOnlinePayment(VerifyOnlinePaymentRequest) returns (VerifyOnlinePaymentResponse);
    rpc GetWalletBalance(GetWalletBalanceRequest) returns (GetWalletBalanceResponse);
    rpc GetTransactionsHistory(GetTransactionsHistoryRequest) returns (GetTransactionsHistoryResponse);
    rpc SetAIModelCostPerReq(SetAIModelCostPerReqRequest) returns (SetAIModelCostPerReqResponse);
    rpc GetAIModelsCostPerReq(GetAIModelsCostPerReqRequest) returns (GetAIModelsCostPerReqResponse);
    rpc BuyAIModelReqPackage(BuyAIModelReqPackageRequest) returns (BuyAIModelReqPackageResponse);
    rpc GetAIModelRequestCount(GetAIModelRequestCountRequest) returns (GetAIModelRequestCountResponse);
    rpc GetUsersWalletBalance(GetUsersWalletBalanceRequest) returns (GetUsersWalletBalanceResponse);
    rpc CreateStoragePlan(CreateStoragePlanRequest) returns (CreateStoragePlanResponse);
    rpc GetStoragePlan(GetStoragePlanRequest) returns (GetStoragePlanResponse);
    rpc ListStoragePlans(ListStoragePlansRequest) returns (ListStoragePlansResponse);
    rpc UpdateStoragePlan(UpdateStoragePlanRequest) returns (UpdateStoragePlanResponse);
    rpc DeleteStoragePlan(DeleteStoragePlanRequest) returns (DeleteStoragePlanResponse);
    rpc SubscribeStoragePlan(SubscribeStoragePlanRequest) returns (SubscribeStoragePlanResponse);
    rpc UpgradeStoragePlan(UpgradeStoragePlanRequest) returns (UpgradeStoragePlanResponse);
    rpc RenewStoragePlan(RenewStoragePlanRequest) returns (RenewStoragePlanResponse);
    rpc GetTransactionCounts(GetTransactionCountsRequest) returns (GetTransactionCountsResponse);
}


message CreateNewWalletRequest {
    uint32 user_id = 1;
}

message CreateNewWalletResponse { // empty message
}


message HasUserWalletRequest {
    uint32 user_id = 1;
}

message HasUserWalletResponse {
    bool has_wallet = 1;
}


message OnlinePaymentRequest {
    uint32 user_id = 1;
    uint64 amount = 2; // in Rials ﷼
}

message OnlinePaymentResponse {
    string online_payment_url = 1;
}


message VerifyOnlinePaymentRequest {
    uint64 track_id = 1;
}

message VerifyOnlinePaymentResponse {
    bool was_successful = 1;
}


message GetWalletBalanceRequest {
    uint32 user_id = 1;
}

message GetWalletBalanceResponse {
    uint64 balance = 1; // in Rials ﷼
}


message GetUsersWalletBalanceRequest {
    repeated string user_ids = 1; // if empty, returns all users
    optional uint64 min_balance = 2; // in Rials ﷼
    optional uint64 max_balance = 3; // in Rials ﷼
}

message GetUsersWalletBalanceResponse {
    map<string, uint64> balances = 1; // in Rials ﷼
}

enum TransactionKind {
    UNKNOWN_KIND = 0;
    DEPOSIT = 1;
    WITHDRAW = 2;
    AI_MODEL_COST = 3;
    STORAGE_COST = 4;
}
enum TransactionStatus {
    UNKNOWN_STATUS = 0;
    PENDING = 1;
    SUCCESSFUL = 2;
    FAILED = 3;
}

enum GroupByPeriod {
    DAY = 0;
    WEEK = 1;
    MONTH = 2;
}

message Transaction {
    uint64 amount = 1; // in Rials ﷼
    google.protobuf.Timestamp created_at = 2; // UTC
    TransactionKind kind = 3;
    TransactionStatus status = 4;
    string ai_model_name = 5;
}

message GetTransactionsHistoryRequest {
    uint32 user_id = 1;
}

message GetTransactionsHistoryResponse {
    repeated Transaction transactions = 1;
}


message SetAIModelCostPerReqRequest {
    string ai_model_name = 1;
    uint32 cost_per_req = 2; // in Rials ﷼
}

message SetAIModelCostPerReqResponse { // empty message
}


message GetAIModelsCostPerReqRequest {
    repeated string ai_model_names = 1; // ["__all__"] for all models cost
}

message GetAIModelsCostPerReqResponse {
    map<string, uint32> costs = 1; // in Rials ﷼
}


message BuyAIModelReqPackageRequest {
    uint32 user_id = 1;
    string username = 2;
    string ai_model_name = 3;
    uint64 req_count = 4;
}

message BuyAIModelReqPackageResponse { // empty message
}


message GetAIModelRequestCountRequest {
    string username = 1;
    string ai_model_name = 2;
}

message GetAIModelRequestCountResponse {
    uint64 req_count = 1;
}

message StoragePlan {
    string id = 1;
    string name = 2;
    uint64 storage_limit_mb = 3;  // Storage in MB
    uint32 duration_days = 4;     // Subscription period (e.g., 30 days)
    double price = 5;             // Price in Rials
    string description = 6;       // Optional description
}

message CreateStoragePlanRequest {
    string name = 1;
    uint64 storage_limit_mb = 2;
    uint32 duration_days = 3;
    double price = 4;
    string description = 5;
}

message CreateStoragePlanResponse {
    StoragePlan plan = 1;
}

message GetStoragePlanRequest {
    string id = 1;
}

message GetStoragePlanResponse {
    StoragePlan plan = 1;
}

message ListStoragePlansRequest {
    int32 page_size = 1;
    int32 page_number = 2;
}

message ListStoragePlansResponse {
    repeated StoragePlan plans = 1;
    int32 total_plans = 2;
}

message UpdateStoragePlanRequest {
    string id = 1;
    optional string name = 2;
    optional uint64 storage_limit_mb = 3;
    optional uint32 duration_days = 4;
    optional double price = 5;
    optional string description = 6;
}

message UpdateStoragePlanResponse {
    StoragePlan plan = 1;
}

message DeleteStoragePlanRequest {
    string id = 1;
}

message DeleteStoragePlanResponse {
    bool success = 1;
}

message UserStoragePlan {
    string id = 1;
    uint32 user_id = 2;
    double price = 3;
    string expiration_date = 4;
}

message SubscribeStoragePlanRequest {
    uint32 user_id = 1;
    string username = 2;
    string storage_plan_id = 3;
}

message SubscribeStoragePlanResponse {
    UserStoragePlan user_storage_plan = 1;
}

message UpgradeStoragePlanRequest {
    int32 user_id = 1;
    string username = 2;
    string storage_plan_id = 3;
}

message UpgradeStoragePlanResponse {
    UserStoragePlan user_storage_plan = 1;
}

message RenewStoragePlanRequest {
    int32 user_id = 1;
    string username = 2;
}

message RenewStoragePlanResponse {
    UserStoragePlan user_storage_plan = 1;
}

message GetTransactionCountsRequest {
    google.protobuf.Timestamp start_date = 1;
    google.protobuf.Timestamp end_date = 2;
    GroupByPeriod group_by = 3;
    optional TransactionStatus status_filter = 4;
    optional TransactionKind kind_filter = 5;
}

message TransactionCountData {
    string period = 1; // Date string representing the period (e.g., "2024-01-15", "2024-W03", "2024-01")
    uint64 count = 2;
}

message GetTransactionCountsResponse {
    repeated TransactionCountData counts = 1;
}
